<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    :root {
      --header-height: 50px;
      --primary-color: #0078d4;
      --danger-color: #ff4d4d;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    header {
      background: var(--primary-color);
      color: white;
      padding: 5px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--header-height);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      position: relative;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }

    button {
      padding: 6px 12px;
      background-color: var(--danger-color);
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #c70000;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - var(--header-height));
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* 🔹 Power BI: ocupa todo el espacio disponible */
    iframe[src*="app.powerbi.com"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      overflow: hidden;
    }

    /* 🔹 Looker Studio: tamaño fijo y centrado con márgenes laterales */
    iframe[src*="lookerstudio.google.com"] {
      width: 1600px;
      height: 940px;
      border: none;
      background: #000;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .no-dashboard {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - var(--header-height));
      color: #666;
      font-size: 18px;
      text-align: center;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-left">
      <img src="https://grupoipsmexico.com/assets/images/logo.png" alt="Logo GRUPO IPS PERÚ" class="logo" />
      <h2>DASHBOARD - GRUPO IPS PERÚ</h2>
    </div>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <main>
    <div class="loader" id="loader"></div>
    <iframe id="dashboardFrame" scrolling="no"></iframe>
    <div id="noDashboardMsg" class="no-dashboard" style="display: none;">
      No se ha cargado ningún dashboard.
    </div>
  </main>

  <script>
    const iframe = document.getElementById("dashboardFrame");
    const msg = document.getElementById("noDashboardMsg");
    const loader = document.getElementById("loader");

    function inicializarDashboard() {
      if (sessionStorage.getItem("loggedIn") !== "true") {
        window.location.href = "index.html";
        return;
      }

      const link = sessionStorage.getItem("dashboardLink");

      if (link) {
        iframe.src = link;
        iframe.style.display = "block";
        msg.style.display = "none";
        loader.style.display = "block";

        iframe.onload = () => {
          loader.style.display = "none";
        };
      } else {
        iframe.style.display = "none";
        loader.style.display = "none";
        msg.style.display = "flex";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }

    inicializarDashboard();
  </script>
</body>
</html>

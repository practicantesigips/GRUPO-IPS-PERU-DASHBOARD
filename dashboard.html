<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    :root {
      --header-height: 50px;
      --primary-color: #0078d4;
      --danger-color: #ff4d4d;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f5f7fa;
      color: #333;
    }

    header {
      background: var(--primary-color);
      color: white;
      padding: 5px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--header-height);
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      z-index: 10;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }

    button {
      padding: 6px 12px;
      background-color: var(--danger-color);
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #c70000;
    }

    main {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 🔹 IFRAME LOOKER STUDIO */
    iframe.looker {
      width: 1600px;
      height: calc(100vh - var(--header-height));
      border: none;
      display: block;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
      border-radius: 6px;
    }

    /* 🔹 IFRAME POWER BI (SE ADAPTA NORMAL) */
    iframe.powerbi {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

  </style>
</head>

  </header>

  <main>
    <div class="loader" id="loader"></div>
    <iframe id="dashboardFrame" scrolling="no"></iframe>
  </main>

  <script>
    const HEADER_HEIGHT = 50;
    const iframe = document.getElementById("dashboardFrame");
    const loader = document.getElementById("loader");

    function inicializarDashboard() {
      if (sessionStorage.getItem("loggedIn") !== "true") {
        window.location.href = "index.html";
        return;
      }

      const link = sessionStorage.getItem("dashboardLink");
      if (!link) return;

      iframe.src = link;
      loader.style.display = "block";

      iframe.onload = () => {
        loader.style.display = "none";
      };

      // 🔹 Detectar si es un enlace de Looker Studio
      if (link.includes("lookerstudio.google.com")) {
        iframe.className = "looker";
      } else {
        iframe.className = "powerbi";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }

    inicializarDashboard();
  </script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background: #0078d4;
      color: white;
      padding: 5px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      box-sizing: border-box;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }

    button {
      padding: 6px 12px;
      background-color: #ff4d4d;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #cc0000;
    }

    /* ===== IFRAME general ===== */
    iframe {
      position: absolute;
      top: 50px; /* debajo del header */
      left: 0;
      width: 100vw;
      height: calc(100vh - 50px);
      border: none;
      overflow: hidden;
      display: none;
    }

    /* ===== Ajuste especial Looker Studio ===== */
    iframe[src*="lookerstudio.google.com"] {
      display: block;
      width: 100vw; /* ocupa todo el ancho */
      height: calc(100vh - 50px);
      border: none;
      overflow: hidden;
      background: #000;
    }

    /* ===== Ajuste Power BI ===== */
    iframe[src*="app.powerbi.com"] {
      display: block;
      width: 100vw;
      height: calc(100vh - 50px);
      border: none;
    }

    /* Mensaje por si no hay enlace */
    .no-dashboard {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 50px);
      color: #666;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="https://grupoipsmexico.com/assets/images/logo.png" alt="Logo GRUPO IPS PERÚ" class="logo">
      <h2>DASHBOARD - GRUPO IPS PERÚ</h2>
    </div>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <iframe id="dashboardFrame" scrolling="no"></iframe>
  <div id="noDashboardMsg" class="no-dashboard" style="display:none;">
    No se ha cargado ningún dashboard.
  </div>

  <script>
    if (sessionStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    } else {
      const link = sessionStorage.getItem("dashboardLink");
      const iframe = document.getElementById("dashboardFrame");
      const msg = document.getElementById("noDashboardMsg");

      if (link) {
        iframe.src = link;
        iframe.style.display = "block";
        msg.style.display = "none";

        // Configuración dinámica
        if (link.includes("lookerstudio.google.com")) {
          iframe.style.width = "100vw";
          iframe.style.height = "calc(100vh - 50px)";
          iframe.setAttribute("scrolling", "no");
        } else if (link.includes("app.powerbi.com")) {
          iframe.style.width = "100vw";
          iframe.style.height = "calc(100vh - 50px)";
        } else {
          iframe.style.width = "100%";
          iframe.style.height = "calc(100% - 50px)";
        }
      } else {
        iframe.style.display = "none";
        msg.style.display = "flex";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

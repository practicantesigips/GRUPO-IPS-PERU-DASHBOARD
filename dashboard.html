<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* 🚫 Sin scroll en toda la página */
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background: #0078d4;
      color: white;
      padding: 5px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      box-sizing: border-box;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }

    button {
      padding: 6px 12px;
      background-color: #ff4d4d;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #cc0000;
    }

    /* ===== IFRAME general ===== */
    iframe {
      position: absolute;
      top: 50px; /* debajo del header */
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      border: none;
      overflow: hidden;
      display: none;
    }

    /* ===== Ajuste especial Looker Studio ===== */
    iframe[src*="lookerstudio.google.com"] {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== Contenedor de Looker para mantener proporción ===== */
    .looker-wrapper {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    .looker-frame {
      width: 1366px;    /* base de 16:9 */
      height: 768px;    /* base de 16:9 */
      max-width: 100%;
      max-height: calc(100vh - 50px);
      border: none;
      transform-origin: center center;
    }

    /* Mensaje por si no hay enlace */
    .no-dashboard {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 50px);
      color: #666;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="https://grupoipsmexico.com/assets/images/logo.png" alt="Logo GRUPO IPS PERÚ" class="logo">
      <h2>DASHBOARD - GRUPO IPS PERÚ</h2>
    </div>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <div id="lookerWrapper" class="looker-wrapper" style="display:none;">
    <iframe id="lookerFrame" class="looker-frame" scrolling="no"></iframe>
  </div>

  <iframe id="dashboardFrame"></iframe>
  <div id="noDashboardMsg" class="no-dashboard" style="display:none;">
    No se ha cargado ningún dashboard.
  </div>

  <script>
    // Verificación de sesión
    if (sessionStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    } else {
      const link = sessionStorage.getItem("dashboardLink");
      const iframe = document.getElementById("dashboardFrame");
      const lookerWrapper = document.getElementById("lookerWrapper");
      const lookerFrame = document.getElementById("lookerFrame");
      const msg = document.getElementById("noDashboardMsg");

      if (link) {
        msg.style.display = "none";

        if (link.includes("lookerstudio.google.com")) {
          iframe.style.display = "none";
          lookerWrapper.style.display = "flex";
          lookerFrame.src = link;

          // 🔧 Ajuste automático de escala según ventana
          function resizeLooker() {
            const scaleX = window.innerWidth / 1366;
            const scaleY = (window.innerHeight - 50) / 768;
            const scale = Math.min(scaleX, scaleY);
            lookerFrame.style.transform = `scale(${scale})`;
          }

          window.addEventListener("resize", resizeLooker);
          resizeLooker();

        } else {
          // Para Power BI u otros
          lookerWrapper.style.display = "none";
          iframe.style.display = "block";
          iframe.src = link;
          iframe.style.width = "100vw";
          iframe.style.height = "calc(100vh - 50px)";
        }
      } else {
        iframe.style.display = "none";
        lookerWrapper.style.display = "none";
        msg.style.display = "flex";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

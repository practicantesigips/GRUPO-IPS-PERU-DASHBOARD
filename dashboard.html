<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    :root {
      --header-height: 50px;
      --primary-color: #0078d4;
      --danger-color: #ff4d4d;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f5f7fa;
      color: #333;
    }

    header {
      background: var(--primary-color);
      color: white;
      padding: 5px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--header-height);
      box-sizing: border-box;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      z-index: 10;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }

    button {
      padding: 6px 12px;
      background-color: var(--danger-color);
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #c70000;
    }

    main {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
      background-color: #000;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      border: none;
      overflow: hidden;
      background: #000;
      transition: height 0.3s ease;
    }

    .no-dashboard {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - var(--header-height));
      color: #666;
      font-size: 18px;
      text-align: center;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-left">
      <img src="https://grupoipsmexico.com/assets/images/logo.png" alt="Logo GRUPO IPS PERÚ" class="logo">
      <h2>DASHBOARD - GRUPO IPS PERÚ</h2>
    </div>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <main>
    <div class="loader" id="loader"></div>
    <iframe id="dashboardFrame" scrolling="no"></iframe>
    <div id="noDashboardMsg" class="no-dashboard" style="display:none;">
      No se ha cargado ningún dashboard.
    </div>
  </main>

  <script>
    const HEADER_HEIGHT = 50;
    const iframe = document.getElementById("dashboardFrame");
    const msg = document.getElementById("noDashboardMsg");
    const loader = document.getElementById("loader");

    function ajustarAlturaIframe() {
      const alturaBase = window.innerHeight - HEADER_HEIGHT;
      const link = sessionStorage.getItem("dashboardLink") || "";
      
      // 🔹 Ajuste especial para Looker Studio (para evitar scroll al mostrar lista lateral)
      if (link.includes("lookerstudio.google.com")) {
        iframe.style.height = (alturaBase + 15) + "px"; // agrega un margen de compensación
      } else {
        iframe.style.height = alturaBase + "px";
      }
    }

    function inicializarDashboard() {
      if (sessionStorage.getItem("loggedIn") !== "true") {
        window.location.href = "index.html";
        return;
      }

      const link = sessionStorage.getItem("dashboardLink");

      if (link) {
        iframe.src = link;
        iframe.style.display = "block";
        msg.style.display = "none";
        loader.style.display = "block";
        iframe.setAttribute("scrolling", "no");

        iframe.onload = () => {
          loader.style.display = "none";
          ajustarAlturaIframe();
        };

        window.addEventListener("resize", ajustarAlturaIframe);

        // Ajustes progresivos en caso de re-render del Looker
        [500, 1500, 3000].forEach(t => setTimeout(ajustarAlturaIframe, t));

      } else {
        iframe.style.display = "none";
        loader.style.display = "none";
        msg.style.display = "flex";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }

    inicializarDashboard();
  </script>
</body>
</html>

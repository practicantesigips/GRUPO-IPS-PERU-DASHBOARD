<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* 🚫 Evita scroll en toda la página */
      font-family: Arial, sans-serif;
    }

    header {
      background: #0078d4;
      color: white;
      padding: 5px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
    }

    iframe {
      position: absolute;
      top: 50px; /* altura del header */
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      border: none;
      overflow: hidden; /* 🚫 Evita scroll dentro del iframe */
    }

    button {
      padding: 6px 12px;
      background-color: #ff4d4d;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #cc0000;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="https://grupoipsmexico.com/assets/images/logo.png" alt="Logo GRUPO IPS PERÚ" class="logo">
      <h2>DASHBOARD - GRUPO IPS PERÚ</h2>
    </div>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <iframe id="dashboardFrame" scrolling="no"></iframe>

  <script>
    // Revisión de sesión
    if (sessionStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html"; // Redirige si no hay sesión activa
    } else {
      // Cargar el enlace del dashboard desde la sesión
      const link = sessionStorage.getItem("dashboardLink");
      const iframe = document.getElementById("dashboardFrame");

      if (link) {
        iframe.src = link;
      } else {
        iframe.src = "about:blank";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

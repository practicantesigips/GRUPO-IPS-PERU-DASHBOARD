<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD - GRUPO IPS PERÚ</title>
  <style>
    /* ===== RESETEO GENERAL ===== */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* 🚫 elimina cualquier scroll global */
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    /* ===== HEADER SUPERIOR ===== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #0078d4;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 15px;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    img.logo {
      height: 35px;
      object-fit: contain;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
    }

    button {
      padding: 6px 12px;
      background-color: #ff4d4d;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #cc0000;
    }

    /* ===== CONTENEDOR DEL IFRAME ===== */
    iframe {
      position: absolute;
      top: 50px; /* justo debajo del header */
      left: 0;
      right: 0;
      bottom: 0; /* ocupa hasta el borde inferior exacto */
      width: 100%;
      height: calc(100% - 50px);
      border: none;
      overflow: hidden;
      display: block;
      background: #000;
    }

    /* ===== Looker Studio: sin barras internas ===== */
    iframe[src*="lookerstudio.google.com"] {
      scrollbar-width: none;
    }
    iframe[src*="lookerstudio.google.com"]::-webkit-scrollbar {
      display: none;
    }

    /* ===== Power BI: sin barras internas ===== */
    iframe[src*="app.powerbi.com"] {
      scrollbar-width: none;
    }
    iframe[src*="app.powerbi.com"]::-webkit-scrollbar {
      display: none;
    }

    .no-dashboard {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #666;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="https://grupoipsmexico.com/assets/images/logo.png" alt="Logo GRUPO IPS PERÚ" class="logo">
      <h2>DASHBOARD - GRUPO IPS PERÚ</h2>
    </div>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <iframe id="dashboardFrame" scrolling="no"></iframe>

  <div id="noDashboardMsg" class="no-dashboard" style="display:none;">
    No se ha cargado ningún dashboard.
  </div>

  <script>
    // Verificación de sesión
    if (sessionStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    } else {
      const link = sessionStorage.getItem("dashboardLink");
      const iframe = document.getElementById("dashboardFrame");
      const msg = document.getElementById("noDashboardMsg");

      if (link) {
        iframe.src = link;
        iframe.style.display = "block";
        msg.style.display = "none";
        iframe.setAttribute("scrolling", "no");
      } else {
        iframe.style.display = "none";
        msg.style.display = "flex";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("dashboardLink");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
